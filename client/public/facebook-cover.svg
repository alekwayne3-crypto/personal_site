<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 312" width="820" height="312">
  <defs>

    <!-- Honeycomb pattern — right side texture -->
    <pattern id="hc" x="0" y="0" width="52" height="90" patternUnits="userSpaceOnUse">
      <polygon points="26,0 52,15 52,45 26,60 0,45 0,15"    fill="none" stroke="#F5C200" stroke-width="1"/>
      <polygon points="0,45 26,60 26,90 0,105 -26,90 -26,60" fill="none" stroke="#F5C200" stroke-width="1"/>
      <polygon points="52,45 78,60 78,90 52,105 26,90 26,60" fill="none" stroke="#F5C200" stroke-width="1"/>
    </pattern>

    <!-- Honeycomb mask: invisible left, fades in right -->
    <linearGradient id="hc-mask-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="black" stop-opacity="0"/>
      <stop offset="35%"  stop-color="black" stop-opacity="0"/>
      <stop offset="65%"  stop-color="black" stop-opacity="1"/>
      <stop offset="100%" stop-color="black" stop-opacity="1"/>
    </linearGradient>
    <mask id="hc-mask">
      <rect x="0" y="0" width="820" height="312" fill="url(#hc-mask-grad)"/>
    </mask>

    <!-- Warm glow behind logo -->
    <radialGradient id="logo-glow" cx="18%" cy="50%" r="28%">
      <stop offset="0%"   stop-color="#F5C200" stop-opacity="0.22"/>
      <stop offset="60%"  stop-color="#F5C200" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#F5C200" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle dark vignette edges -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="40%"  stop-color="#0b0b0b" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0b0b0b" stop-opacity="0.65"/>
    </radialGradient>

  </defs>

  <!-- ── Base background ── -->
  <rect x="0" y="0" width="820" height="312" fill="#0b0b0b"/>

  <!-- ── Honeycomb texture (right half only) ── -->
  <rect x="0" y="0" width="820" height="312" fill="url(#hc)" opacity="0.16" mask="url(#hc-mask)"/>

  <!-- ── Glow layers ── -->
  <rect x="0" y="0" width="820" height="312" fill="url(#logo-glow)"/>
  <rect x="0" y="0" width="820" height="312" fill="url(#vignette)"/>

  <!-- ── Logo ── -->
  <image href="./logo.webp"
         x="20" y="14" width="272" height="284"
         preserveAspectRatio="xMidYMid meet"/>

  <!-- ── Thin vertical divider ── -->
  <line x1="308" y1="48" x2="308" y2="264"
        stroke="#F5C200" stroke-width="1" opacity="0.2"/>

  <!-- ── CLEAN BEE ── -->
  <text x="334" y="116"
        font-family="Arial Black, Arial, sans-serif"
        font-weight="900"
        font-size="78"
        fill="#F5C200"
        letter-spacing="-2">CLEAN BEE</text>

  <!-- ── Sub brand line ── -->
  <text x="337" y="146"
        font-family="Arial, sans-serif"
        font-weight="600"
        font-size="13"
        fill="rgba(255,255,255,0.38)"
        letter-spacing="8">PROFESSIONAL  CLEANING  CO.  —  TULSA, OK</text>

  <!-- ── Yellow rule ── -->
  <rect x="334" y="163" width="448" height="1.5" fill="#F5C200" opacity="0.3"/>

  <!-- ── Tagline ── -->
  <text x="334" y="197"
        font-family="Georgia, serif"
        font-style="italic"
        font-size="18"
        fill="rgba(255,255,255,0.68)"
        letter-spacing="0.3">Keeping Tulsa homes clean since 2016.</text>

  <!-- ── Contact info ── -->
  <text x="334" y="228"
        font-family="Arial, sans-serif"
        font-weight="500"
        font-size="13.5"
        fill="rgba(255,255,255,0.38)"
        letter-spacing="0.4">(918) 772-7228   ·   cleanbeetulsa.com</text>

  <!-- ── Trust row ── -->
  <text x="334" y="264"
        font-family="Arial, sans-serif"
        font-weight="700"
        font-size="11.5"
        fill="#F5C200"
        opacity="0.75"
        letter-spacing="0.5">✓ Bonded &amp; Insured    ✓ Background-Checked Staff    ✓ Eco-Friendly    ✓ Satisfaction Guaranteed</text>

  <!-- ── Yellow bottom bar ── -->
  <rect x="0" y="304" width="820" height="8" fill="#F5C200" opacity="0.8"/>

  <!-- ── Subtle top edge line ── -->
  <rect x="0" y="0" width="820" height="2" fill="#F5C200" opacity="0.12"/>

</svg>
