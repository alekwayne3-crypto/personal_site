<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Yellow rounded background -->
  <rect width="32" height="32" rx="7" fill="#F5C200"/>

  <!-- Wings -->
  <ellipse cx="10.5" cy="13.5" rx="5" ry="2.8" fill="white" fill-opacity="0.88" transform="rotate(-28 10.5 13.5)"/>
  <ellipse cx="21.5" cy="13.5" rx="5" ry="2.8" fill="white" fill-opacity="0.88" transform="rotate(28 21.5 13.5)"/>

  <!-- Body -->
  <ellipse cx="16" cy="21" rx="5" ry="6.5" fill="#111111"/>

  <!-- Stripes on body -->
  <rect x="11.2" y="18.5" width="9.6" height="2.6" rx="1.3" fill="#F5C200"/>
  <rect x="11.2" y="23"   width="9.6" height="2"   rx="1"   fill="#F5C200"/>

  <!-- Head -->
  <circle cx="16" cy="12.5" r="3.8" fill="#111111"/>

  <!-- Antennae -->
  <line x1="14.2" y1="9.2" x2="11.5" y2="6"   stroke="#111111" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="17.8" y1="9.2" x2="20.5" y2="6"   stroke="#111111" stroke-width="1.4" stroke-linecap="round"/>
  <circle cx="11" cy="5.5" r="1.2" fill="#111111"/>
  <circle cx="21" cy="5.5" r="1.2" fill="#111111"/>
</svg>
